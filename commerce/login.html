<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الضامن للمحلات | تسجيل الدخول</title>
<meta name="author" content="SULAIMAN O. ALKHATEEB">
<link rel="icon" href="dhamn-icon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;min-height:100vh;color:#F1EEFA;background:radial-gradient(900px 600px at 90% -10%,rgba(232,86,42,.26),transparent 60%),radial-gradient(800px 600px at 0% 100%,rgba(123,63,242,.2),transparent 60%),#0B0818;display:flex;flex-direction:column}
h1,h2,h3,.kufi{font-family:'Noto Kufi Arabic',sans-serif;line-height:1.45}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Noto Kufi Arabic';font-weight:800;font-size:17px}.brand img{height:36px}.brand small{display:block;font-family:'IBM Plex Sans Arabic';font-size:11px;color:#FFC066;font-weight:600;line-height:1}
.pillk{font-size:12.5px;padding:8px 13px;border-radius:11px;border:1px solid rgba(255,255,255,.12);display:inline-flex;gap:7px;align-items:center;color:#d6d2ec}
.pillk:hover{border-color:#FF9A3D;color:#fff}
.wrap{flex:1;display:grid;place-items:center;padding:10px 18px 30px}
.box{width:min(760px,100%)}
.box h1{font-size:clamp(23px,3.4vw,34px);font-weight:900;text-align:center}
.box h1 span{background:linear-gradient(100deg,#FFC066,#FF7A45 45%,#B79CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.box>p{text-align:center;color:#A9A3C6;margin:6px auto 24px;max-width:560px;font-size:14.5px}
.step{display:none}.step.on{display:block;animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.role{text-align:start;padding:22px 18px;border-radius:22px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.09);transition:.25s;display:flex;flex-direction:column;gap:8px}
.role:hover{transform:translateY(-3px);border-color:#FF9A3D;background:rgba(255,154,61,.07)}
.role .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:21px;color:#fff;margin-bottom:6px}
.role b{font-family:'Noto Kufi Arabic';font-size:16px}.role span{font-size:12.8px;color:#A9A3C6;line-height:1.7}
@media(max-width:700px){.roles{grid-template-columns:1fr}.role{flex-direction:row;align-items:center;gap:14px}.role .ic{margin:0;flex-shrink:0}}
.views{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px;margin:0 auto}
.vw{padding:24px 18px;border-radius:22px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.09);text-align:center;transition:.25s}
.vw:hover{border-color:#FF9A3D;transform:translateY(-3px)}
.vw i{font-size:34px;color:#FFC066;margin-bottom:10px;display:block}.vw b{font-family:'Noto Kufi Arabic';display:block}.vw span{font-size:12.5px;color:#A9A3C6}
.accs{display:grid;gap:12px;max-width:560px;margin:0 auto}
.acc{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;text-align:start;padding:16px;border-radius:20px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.09);transition:.25s}
.acc:hover{border-color:#FF9A3D;background:rgba(255,154,61,.06)}
.acc .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:20px;color:#fff}
.acc b{font-size:15px;display:block}.acc span{font-size:12.3px;color:#A9A3C6;display:block;line-height:1.7}
.tg{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.back{display:flex;align-items:center;gap:7px;margin:18px auto 0;font-size:13px;color:#A9A3C6}
.back:hover{color:#fff}
.note{margin-top:18px;text-align:center;font-size:12px;color:#706A96}
.reset{font-size:12px;color:#A9A3C6;text-decoration:underline;margin-top:8px}
footer{text-align:center;font-size:12px;color:#706A96;padding:18px}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html"><img src="dhamn-icon.png" alt=""><div>الضامن<small>للمحلات التجارية</small></div></a><div style="display:flex;gap:8px"><a class="pillk" href="index.html"><i class="fa-solid fa-circle-info"></i>عن الفكرة</a><a class="pillk" href="../index.html"><i class="fa-solid fa-table-cells-large"></i>كل البوابات</a></div></header>
<div class="wrap"><div class="box">
  <h1>ادخل المنصة <span>بالدور الذي تريد تجربته</span></h1>
  <p>منصة تجريبية متصلة: ما يطلبه التاجر يصل للمزود، وشهادة المزود تُحدّث سجل التاجر، والبلدية ترى النتيجة.</p>
  <div class="step on" id="s1"><div class="roles">
    <button class="role" onclick="pick('merchant')"><span class="ic" style="background:linear-gradient(135deg,#FF9A3D,#E8562A)"><i class="fa-solid fa-store"></i></span><div><b>التاجر</b><br><span>سجل الامتثال، الفواتير، عين الضامن، وتجديد الرخصة.</span></div></button>
    <button class="role" onclick="pick('muni')"><span class="ic" style="background:linear-gradient(135deg,#14806A,#0E5E4E)"><i class="fa-solid fa-landmark"></i></span><div><b>البلدية</b><br><span>مؤشرات الامتثال، التفتيش الموجّه بالخطورة، والتجديدات.</span></div></button>
    <button class="role" onclick="pick('provider')"><span class="ic" style="background:linear-gradient(135deg,#7B3FF2,#4F46E5)"><i class="fa-solid fa-helmet-safety"></i></span><div><b>مزود خدمات السلامة</b><br><span>طلبات الصيانة، إصدار الشهادات الموثقة، وتحقق الفواتير.</span></div></button>
  </div></div>
  <div class="step" id="s2"><div class="views">
    <button class="vw" onclick="view('mobile')"><i class="fa-solid fa-mobile-screen-button"></i><b>تطبيق الجوال</b><span>عرض داخل إطار جوال</span></button>
    <button class="vw" onclick="view('desktop')"><i class="fa-solid fa-display"></i><b>متصفح كامل</b><span>لوحة على كامل الشاشة</span></button>
  </div><button class="back" onclick="go('s1')"><i class="fa-solid fa-arrow-right"></i>رجوع</button></div>
  <div class="step" id="s3"><div class="accs" id="accs"></div><button class="back" onclick="go(narrow()?'s1':'s2')"><i class="fa-solid fa-arrow-right"></i>رجوع</button></div>
  <div class="note">حسابات تجريبية · لا يلزم كلمة مرور<br><button class="reset" onclick="try{['dz_shops_v1','dz_jobs_v1','dz_ver_v1','dz_issued_v1','dz_insp_v1','dz_pst_v1'].forEach(k=>localStorage.removeItem(k))}catch(e){};this.textContent='تمت إعادة بيانات العرض ✓'">إعادة بيانات العرض للبداية</button></div>
</div></div>
<script>
let R=null,V='desktop';const narrow=()=>innerWidth<=820;
const PAGE={merchant:'merchant.html',muni:'municipality.html',provider:'provider.html'};
const ACC={merchant:[['m1','مطعم السفرة الذهبية','مطعم · حي النرجس · الأساسيات مكتملة وعين الضامن مفعّلة','fa-utensils','linear-gradient(135deg,#FF9A3D,#E8562A)','ممتثل','background:rgba(95,211,165,.15);color:#5FD3A5'],['m2','مخبز ريحانة الصباح','مخبز · حي الياسمين · طفاية منتهية وكاميرا متوقفة','fa-bread-slice','linear-gradient(135deg,#FF6B7D,#C2410C)','أساسيات ناقصة','background:rgba(255,107,125,.15);color:#FF8A97']],
 muni:[['b1','بلدية شمال الرياض','إدارة الرقابة الصحية والتراخيص · 48 محلاً تجريبياً','fa-landmark','linear-gradient(135deg,#14806A,#0E5E4E)','مدير الرقابة','background:rgba(22,209,194,.14);color:#8BF5EA']],
 provider:[['p1','مؤسسة درع الأمان لأنظمة السلامة','طفايات · إنذار · كواشف · إنارة طوارئ','fa-fire-extinguisher','linear-gradient(135deg,#7B3FF2,#4F46E5)','معتمد','background:rgba(168,139,255,.15);color:#C9B8FF'],['p2','شركة رؤية الأمن للكاميرات','تركيب وصيانة كاميرات المراقبة','fa-video','linear-gradient(135deg,#4F46E5,#16D1C2)','معتمد','background:rgba(168,139,255,.15);color:#C9B8FF']]};
function go(id){document.querySelectorAll('.step').forEach(s=>s.classList.toggle('on',s.id===id))}
function pick(r){R=r;if(narrow()){V='mobile';accs()}else go('s2')}
function view(v){V=v;accs()}
function accs(){document.getElementById('accs').innerHTML=ACC[R].map(a=>`<button class="acc" onclick="enter('${a[0]}')"><span class="ic" style="background:${a[4]}"><i class="fa-solid ${a[3]}"></i></span><div><b>${a[1]}</b><span>${a[2]}</span></div><span class="tg" style="${a[6]}">${a[5]}</span></button>`).join('');go('s3')}
function enter(acc){try{sessionStorage.setItem('dz_session',JSON.stringify({role:R,view:V,acc}))}catch(e){}
 location.href=(V==='mobile'&&!narrow())?'frame.html?p='+PAGE[R]:PAGE[R]}
const q=new URLSearchParams(location.search).get('r');if(q&&PAGE[q])pick(q);
</script>
</body>
</html>
