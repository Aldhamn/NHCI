<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الضامن | لوحة البلدية</title>
<meta name="author" content="SULAIMAN O. ALKHATEEB">
<link rel="icon" href="dhamn-icon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="portal.css">
<script src="core.js"></script>
<script>DZ_GUARD('muni')</script>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="logo"><img src="dhamn-icon.png" alt=""><div><b>الضامن</b><small>لوحة البلدية</small></div></div>
  <div class="devcard"><div class="r"><span class="lg" style="background:linear-gradient(135deg,#14806A,#0E5E4E)"><i class="fa-solid fa-landmark"></i></span><div><b>بلدية شمال الرياض</b><small>إدارة الرقابة الصحية والتراخيص</small></div></div><div class="zone"><i class="fa-solid fa-location-dot"></i>8 أحياء · بيانات توضيحية</div></div>
  <button class="nav-i" data-p="home"><i class="fa-solid fa-chart-pie"></i>نظرة عامة</button>
  <button class="nav-i" data-p="shops"><i class="fa-solid fa-store"></i>المحلات</button>
  <button class="nav-i" data-p="insp"><i class="fa-solid fa-route"></i>التفتيش الموجّه<span class="cnt" id="cI"></span></button>
  <button class="nav-i" data-p="renew"><i class="fa-solid fa-rotate"></i>طابور التجديد</button>
  <button class="nav-i" data-p="eye"><i class="fa-solid fa-eye"></i>مؤشرات عين الضامن</button>
  <button class="nav-i" data-p="prov"><i class="fa-solid fa-helmet-safety"></i>مزودو السلامة</button>
  <button class="nav-i" data-p="rev"><i class="fa-solid fa-coins"></i>الدخل</button>
  <div class="sep">العرض</div>
  <div class="acts"><button onclick="dzView('mobile')"><i class="fa-solid fa-mobile-screen"></i>عرض تطبيق الجوال</button><a href="../index.html"><i class="fa-solid fa-table-cells-large"></i>كل البوابات</a><button onclick="dzLogout()"><i class="fa-solid fa-right-from-bracket"></i>تسجيل الخروج</button></div>
  <div class="foot"><img src="dhamn-icon.png" alt=""><span>نسخة تجريبية</span></div>
</aside>
<div class="main">
  <nav class="mnav"><button data-p="home"><i class="fa-solid fa-chart-pie"></i>نظرة عامة</button><button data-p="shops"><i class="fa-solid fa-store"></i>المحلات</button><button data-p="insp"><i class="fa-solid fa-route"></i>التفتيش</button><button data-p="renew"><i class="fa-solid fa-rotate"></i>التجديد</button><button data-p="eye"><i class="fa-solid fa-eye"></i>عين الضامن</button><button data-p="prov"><i class="fa-solid fa-helmet-safety"></i>المزودون</button><button data-p="rev"><i class="fa-solid fa-coins"></i>الدخل</button><button onclick="dzLogout()" class="x"><i class="fa-solid fa-right-from-bracket"></i>خروج</button></nav>
  <header class="top"><div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div><div class="sp"></div><div class="user"><div><b>مدير الرقابة</b><small>بلدية شمال الرياض</small></div><span class="av" style="background:linear-gradient(135deg,#14806A,#0E5E4E)"><i class="fa-solid fa-landmark"></i></span></div></header>
  <div class="content">
    <section class="page" id="pg-home"></section><section class="page" id="pg-shops"></section><section class="page" id="pg-insp"></section><section class="page" id="pg-renew"></section><section class="page" id="pg-eye"></section><section class="page" id="pg-prov"></section><section class="page" id="pg-rev"></section>
    <div class="credit">بيانات توضيحية</div>
  </div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);let ALL=[];const load=()=>ALL=DZ.allShops();load();
const ICON={'مطعم':'fa-utensils','كافيه':'fa-mug-hot','مخبز':'fa-bread-slice','بقالة':'fa-basket-shopping','صيدلية':'fa-prescription-bottle-medical','مطبخ مناسبات':'fa-kitchen-set','محل حلويات':'fa-cake-candles','ملحمة':'fa-drumstick-bite','مغسلة ملابس':'fa-shirt','صالون':'fa-scissors'};
const lvlP=x=>`<span class="pill ${x.l1?'c-o':'c-r'}">1</span> <span class="pill ${x.l2?'c-o':x.l1?'c-r':'c-n'}">${x.l1?'2':'<i class=\"fa-solid fa-lock\"></i> 2'}</span> <span class="pill ${x.vision&&x.l2?'c-t':'c-n'}">${x.vision&&x.l2?'3':(x.l1&&x.l2?'3':'<i class=\"fa-solid fa-lock\"></i> 3')}</span>`;
const prio=x=>(x.risk==='high'?100:x.risk==='mid'?50:0)+(x.food?25:0)+Math.min(x.lastInsp/10,30)+(x.licDays<30?10:0);
const RENDER={
home(){load();const n=ALL.length,avg=Math.round(ALL.reduce((s,x)=>s+x.score,0)/n),hi=ALL.filter(x=>x.risk==='high'),fh=hi.filter(x=>x.food);
 $('cI').textContent=hi.length;const D=[...new Set(ALL.map(x=>x.dist))].map(d=>{const a=ALL.filter(x=>x.dist===d);return [d,Math.round(a.reduce((s,x)=>s+x.score,0)/a.length),a.length]}).sort((a,b)=>b[1]-a[1]);
 $('pg-home').innerHTML=`<div class="grid g-k"><div class="card kpi"><b>${n}</b><span>محل مسجل في الضامن</span></div><div class="card kpi"><b style="color:${DZ.scol(avg)}">${avg}%</b><span>متوسط مؤشر الامتثال</span></div><div class="card kpi"><b style="color:var(--red)">${hi.length}</b><span>محل أساسياته غير مكتملة</span></div><div class="card kpi"><b style="color:var(--ok)">${ALL.filter(x=>x.badge).length}</b><span>يحمل شارة «مطبخ آمن»</span></div></div>
 <div class="card" style="margin-top:16px;background:linear-gradient(135deg,#FDECEC,#FFF7EE);border-color:#F6C9C9"><div class="hero-s" style="grid-template-columns:auto 1fr auto"><span class="pill c-r" style="width:58px;height:58px;justify-content:center;font-size:24px;border-radius:18px"><i class="fa-solid fa-triangle-exclamation"></i></span><div><h2 style="font-size:16px">${fh.length} محلاً غذائياً لم تكتمل أساسيات السلامة لديه</h2><p>قاعدة الضامن: من لم يضمن الطفاية والكاميرا والإنذار لا يمكن ضمان مطبخه. هذه المحلات تُرفع تلقائياً لأعلى قائمة التفتيش، والزيارة تشمل المطبخ وليس السلامة فقط.</p></div><button class="btn btn-p" onclick="GO('insp')"><i class="fa-solid fa-route"></i>خطة التفتيش</button></div></div>
 <div class="grid g-2"><div class="card"><div class="ch"><h3><i class="fa-solid fa-map-location-dot"></i>الامتثال حسب الحي</h3></div><div class="dist">${D.map(d=>`<div class="dr"><b>${d[0]}</b><div class="bar"><i style="width:${d[1]}%;background:${DZ.scol(d[1])}"></i></div><span>${d[1]}%</span></div>`).join('')}</div></div>
  <div class="card"><div class="ch"><h3><i class="fa-solid fa-stairs"></i>سُلّم الامتثال في المدينة</h3></div>${[[1,ALL.filter(x=>x.l1).length,'سلامة المنشأة مكتملة'],[2,ALL.filter(x=>x.l2).length,'صحة المنشأة مكتملة'],[3,ALL.filter(x=>x.vision&&x.l2).length,'عين الضامن مفعّلة']].map(r=>`<div class="q" style="margin-bottom:14px"><div class="hd"><b>المستوى ${r[0]} · ${r[2]}</b><span class="lft">${r[1]}/${n}</span></div><div class="qbar"><i style="width:${r[1]/n*100}%;background:${DZ.LV[r[0]].c}"></i></div></div>`).join('')}<div class="hint"><i class="fa-solid fa-circle-info"></i><span>المستوى لا يُحتسب قبل اكتمال الذي قبله.</span></div></div></div>`},
shops(){load();const f=$('fq')?$('fq').value:'',r=$('fr')?$('fr').value:'';
 $('pg-shops').innerHTML=`<div class="card"><div class="tools"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="fq" placeholder="ابحث باسم المحل أو الحي" value="${f}"></div><select id="fr"><option value="">كل مستويات الخطورة</option><option value="high" ${r==='high'?'selected':''}>مرتفع</option><option value="mid" ${r==='mid'?'selected':''}>متوسط</option><option value="low" ${r==='low'?'selected':''}>منخفض</option></select></div>
 <div class="tw"><table><thead><tr><th>المحل</th><th>النشاط</th><th>الحي</th><th>المؤشر</th><th>المستويات</th><th>الخطورة</th><th>أبرز نقص</th><th>الرخصة</th></tr></thead><tbody>${ALL.filter(x=>(!f||x.name.includes(f)||x.dist.includes(f))&&(!r||x.risk===r)).sort((a,b)=>a.score-b.score).map(x=>`<tr><td><b>${x.name}</b>${x.live?' <span class="pill c-p">حساب تجريبي</span>':''}${x.badge?' <i class="fa-solid fa-shield-heart" style="color:var(--ok)"></i>':''}</td><td><i class="fa-solid ${ICON[x.act]}" style="color:var(--muted)"></i> ${x.act}</td><td>${x.dist}</td><td><div class="mini-p"><div class="prog"><i style="width:${x.score}%;background:${DZ.scol(x.score)}"></i></div><b>${x.score}%</b></div></td><td>${lvlP(x)}</td><td><span class="pill ${DZ.RISK[x.risk][1]}">${DZ.RISK[x.risk][0]}</span></td><td style="white-space:normal;min-width:180px;font-size:12px">${x.issue}</td><td>${x.licDays<0?'<span class="pill c-r">منتهية</span>':x.licDays+' يوم'}</td></tr>`).join('')}</tbody></table></div></div>`;
 $('fq').oninput=()=>{const p=$('fq').selectionStart;RENDER.shops();$('fq').focus();$('fq').setSelectionRange(p,p)};$('fr').onchange=RENDER.shops},
insp(){load();const L=ALL.filter(x=>x.risk!=='low').sort((a,b)=>prio(b)-prio(a)).slice(0,14);const sent=DZ.get('dz_insp_v1',[]);
 $('pg-insp').innerHTML=`<div class="hint" style="margin:0 0 14px"><i class="fa-solid fa-circle-info"></i><span>الترتيب آلي حسب: نقص أساسيات السلامة ← النشاط الغذائي ← مدة آخر زيارة ← قرب انتهاء الرخصة. المحل منخفض الخطورة لا يظهر هنا، فيتفرغ المفتشون للأخطر.</span></div>
 <div class="card"><div class="ch"><h3><i class="fa-solid fa-route"></i>قائمة التفتيش المقترحة لهذا الأسبوع</h3><span class="note">${L.length} زيارة</span></div>${L.map((x,i)=>{const k=!x.l1&&x.food?'سلامة + فحص المطبخ':!x.l1?'سلامة المنشأة':'صحة المنشأة';return `<div class="li"><span class="ic pill ${DZ.RISK[x.risk][1]}" style="width:38px;height:38px;justify-content:center;font-family:'Noto Kufi Arabic';font-weight:900">${i+1}</span><div class="tx"><b>${x.name} · حي ${x.dist}</b><span>${x.issue} · آخر زيارة قبل ${x.lastInsp} يوم${x.food?' · نشاط غذائي':''}</span></div><span class="pill ${!x.l1&&x.food?'c-r':'c-a'}">${k}</span>${sent.includes(x.id)?'<span class="pill c-o"><i class="fa-solid fa-check"></i>أُسندت</span>':`<button class="btn btn-o btn-x" onclick="assign('${x.id}')">إسناد لمفتش</button>`}</div>`}).join('')}</div>`},
renew(){load();const L=ALL.filter(x=>x.licDays<=60).sort((a,b)=>a.licDays-b.licDays);
 $('pg-renew').innerHTML=`<div class="grid g-k"><div class="card kpi"><b>${L.length}</b><span>رخصة تنتهي خلال 60 يوماً</span></div><div class="card kpi"><b style="color:var(--ok)">${L.filter(x=>x.l1&&(!x.food||x.l2)).length}</b><span>جاهزة للتجديد</span></div><div class="card kpi"><b style="color:var(--red)">${L.filter(x=>!(x.l1&&(!x.food||x.l2))).length}</b><span>متوقفة على اشتراطات</span></div><div class="card kpi"><b>0</b><span>مستند ورقي مطلوب</span></div></div>
 <div class="card" style="margin-top:16px"><div class="tw"><table><thead><tr><th>المحل</th><th>الحي</th><th>تنتهي خلال</th><th>المؤشر</th><th>الجاهزية</th><th>السبب</th></tr></thead><tbody>${L.map(x=>{const ok=x.l1&&(!x.food||x.l2);return `<tr><td><b>${x.name}</b></td><td>${x.dist}</td><td>${x.licDays<0?'<span class="pill c-r">منتهية</span>':x.licDays+' يوم'}</td><td>${x.score}%</td><td><span class="pill ${ok?'c-o':'c-r'}">${ok?'جاهز':'غير جاهز'}</span></td><td style="font-size:12px;white-space:normal">${ok?'السجل مكتمل وموثق':x.issue}</td></tr>`}).join('')}</tbody></table></div></div>`},
eye(){load();const v=ALL.filter(x=>x.vision&&x.l2);const C=[['القفاز بعد لمس النقود',38,'fa-mitten'],['بدون غطاء شعر',24,'fa-hat-cowboy-side'],['غسل اليدين',17,'fa-hands-bubbles'],['خلط النيء والمطهو',9,'fa-drumstick-bite'],['نظافة الأسطح',7,'fa-broom'],['التدخين',3,'fa-smoking'],['كاميرا متوقفة',2,'fa-video-slash']];
 const wk=[61,52,44,37,31,27];
 $('pg-eye').innerHTML=`<div class="hint" style="margin:0 0 14px"><i class="fa-solid fa-user-shield"></i><span>البلدية ترى مؤشرات مجمّعة فقط: لا مقاطع ولا وجوه ولا أسماء عاملين. التفاصيل تبقى للتاجر.</span></div>
 <div class="grid g-k"><div class="card kpi"><b>${v.length}</b><span>محل مفعّل عين الضامن</span></div><div class="card kpi"><b>${Math.round(v.reduce((s,x)=>s+(x.visionScore||0),0)/(v.length||1))}%</b><span>متوسط مؤشر السلوك</span></div><div class="card kpi"><b style="color:var(--ok)">▼ 56%</b><span>انخفاض المخالفات منذ التفعيل</span></div><div class="card kpi"><b>${v.length*3}</b><span>كاميرا متصلة</span></div></div>
 <div class="grid g-h" style="margin-top:16px"><div class="card"><div class="ch"><h3><i class="fa-solid fa-chart-bar"></i>توزيع المخالفات حسب النوع</h3><span class="note">آخر 30 يوماً · %</span></div><div class="dist">${C.map(c=>`<div class="dr" style="grid-template-columns:150px 1fr 40px"><span><i class="fa-solid ${c[2]}" style="color:var(--muted)"></i> ${c[0]}</span><div class="bar"><i style="width:${c[1]/38*100}%;background:var(--grad)"></i></div><b>${c[1]}%</b></div>`).join('')}</div></div>
  <div class="card"><div class="ch"><h3><i class="fa-solid fa-chart-line"></i>متوسط المخالفات الأسبوعية لكل محل</h3></div><div class="bars">${wk.map((x,i)=>`<div class="${i>3?'g':''}"><b>${x}</b><i style="height:${x/61*110}px"></i>أ${i+1}</div>`).join('')}</div><div class="hint"><i class="fa-solid fa-lightbulb"></i><span>أعلى مخالفة: القفاز بعد الكاشير. توصية: اشتراط محطة قفازات بجانب الكاشير في المطاعم.</span></div></div></div>`},
prov(){const st=DZ.get('dz_pst_v1',{});
 $('pg-prov').innerHTML=`<div class="card"><div class="ch"><h3><i class="fa-solid fa-helmet-safety"></i>مزودو خدمات السلامة المعتمدون</h3><span class="note">فواتيرهم وحدها تُحتسب في الامتثال</span></div><div class="tw"><table><thead><tr><th>المزود</th><th>التخصص</th><th>الترخيص</th><th>التقييم</th><th>الطلبات</th><th>فواتير مرفوضة</th><th>الحالة</th><th></th></tr></thead><tbody>${DZ.PROV.map((p,i)=>`<tr><td><b>${p.name}</b></td><td>${DZ.CAT[p.cat]}</td><td>${p.lic}</td><td>★ ${p.rate}</td><td>${DZ.fmt(p.jobs)}</td><td>${[2,0,1,0,0,0,7][i]}</td><td><span class="pill ${st[p.id]?'c-r':'c-o'}">${st[p.id]?'موقوف':'معتمد'}</span></td><td><button class="btn btn-o btn-x" onclick="tgl('${p.id}')">${st[p.id]?'إعادة الاعتماد':'إيقاف'}</button></td></tr>`).join('')}</tbody></table></div></div>`},
rev(){load();const n=ALL.length,scale=50000;const R=[['اشتراك سجل الامتثال',scale*300],['اشتراك عين الضامن',scale*.15*3*79*12],['عمولة سوق خدمات السلامة',scale*1200*.1],['رسوم اعتماد المزودين',400*5000]];const T=R.reduce((s,r)=>s+r[1],0);
 $('pg-rev').innerHTML=`<div class="grid g-h"><div class="card"><div class="rev"><small>إجمالي الدخل السنوي التقديري عند ${DZ.fmt(scale)} محل</small><b>${DZ.fmt(T)} ﷼</b><small>قبل أي تقسيم بين الأطراف · النسب لم تُحدد بعد</small></div>${R.map(r=>`<div class="row" style="display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);font-size:13.5px"><span>${r[0]}</span><b>${DZ.fmt(r[1])}</b></div>`).join('')}</div>
 <div class="card"><div class="ch"><h3><i class="fa-solid fa-calculator"></i>الافتراضات</h3></div>${[['اشتراك سجل الامتثال','300 ريال سنوياً لكل محل'],['عين الضامن','15% من المحلات · 3 كاميرات · 79 ريال شهرياً للكاميرا'],['سوق خدمات السلامة','إنفاق 1,200 ريال سنوياً للمحل · عمولة 10%'],['اعتماد المزودين','400 مزود · 5,000 ريال سنوياً'],['تحليلات المخاطر','غير محتسبة']].map(x=>`<div class="chk"><i class="fa-solid fa-circle-dot" style="color:var(--p)"></i><div>${x[0]}<small>${x[1]}</small></div></div>`).join('')}<div class="hint"><i class="fa-solid fa-circle-info"></i><span>الأرقام توضيحية للعرض، وعرض البيانات الحالي يشمل ${n} محلاً تجريبياً.</span></div></div></div>`}};
function assign(id){const s=DZ.get('dz_insp_v1',[]);s.push(id);DZ.set('dz_insp_v1',s);DZ.toast('أُسندت الزيارة لأقرب مفتش متاح');RENDER.insp()}
function tgl(id){const s=DZ.get('dz_pst_v1',{});s[id]=!s[id];DZ.set('dz_pst_v1',s);DZ.toast(s[id]?'تم إيقاف المزود · شهاداته الجديدة لن تُحتسب':'أُعيد اعتماد المزود');RENDER.prov()}
addEventListener('storage',()=>{const on=document.querySelector('.page.on');if(on)RENDER[on.id.slice(3)]()});
DZ.nav({home:['نظرة عامة','امتثال المحلات التجارية في نطاق البلدية'],shops:['المحلات','كل محل بمؤشره ومستوياته'],insp:['التفتيش الموجّه','الزيارات حسب الخطورة لا بالترتيب'],renew:['طابور التجديد','الرخص القريبة من الانتهاء وجاهزيتها'],eye:['مؤشرات عين الضامن','بيانات مجمّعة بدون هوية'],prov:['مزودو السلامة','اعتماد المزودين ومراقبة فواتيرهم'],rev:['الدخل','إجمالي الدخل التقديري']},'home');
</script>
</body>
</html>
